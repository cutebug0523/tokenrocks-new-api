<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>模型与价格 · TokenRocks</title>
<meta name="description" content="TokenRocks 全部模型的价格，每个价格都对比官方原价。特价线路低至官方 0.5 折。">
<link rel="icon" href="/_s/favicon.ico">
<link rel="stylesheet" href="/_s/site.css">
<style>
  .wrap { max-width: 1200px; margin: 0 auto; padding-left: 24px; padding-right: 24px; }
  .tier-btn { min-height: 40px; padding: 0 18px; border: 0; border-radius: 7px; font-size: 15px; font-family: inherit; cursor: pointer; background: #fff; color: var(--text-2); font-weight: 500; }
  .tier-btn[aria-pressed='true'] { background: var(--ink); color: #fff; font-weight: 700; }
  .chip { min-height: 36px; padding: 0 14px; border-radius: 999px; font-size: 14px; font-family: inherit; cursor: pointer; border: 1px solid #d1d5db; background: #fff; color: var(--text-2); }
  .chip[aria-pressed='true'] { border-color: var(--brand); background: var(--brand-light); color: var(--brand-dark); }
  .price-table { width: 100%; min-width: 720px; border-collapse: collapse; font-size: 15px; }
  .price-table th { padding: 12px 16px; font-weight: 600; text-align: left; font-size: 13px; color: var(--muted); background: var(--alt); }
  .price-table td { padding: 14px 16px; border-top: 1px solid var(--line-soft); vertical-align: top; }
  .model-name { font-family: var(--mono); font-weight: 700; font-size: 14px; text-decoration: none; word-break: break-all; }
  .model-desc { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .num { font-family: var(--mono); font-weight: 700; white-space: nowrap; }
  .official { font-family: var(--mono); font-size: 12px; color: var(--muted-2); }
  .badge { display: inline-block; font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap; color: var(--brand-dark); background: var(--brand-soft); }
  .badge.off { color: var(--muted); background: #f3f4f6; font-weight: 600; }
  .img-card { border: 1px solid var(--line); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 8px; }
  .status { padding: 28px 16px; text-align: center; color: var(--muted); }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  @media (max-width: 640px) {
    .wrap { padding-left: 16px; padding-right: 16px; }
    .page-title { font-size: 30px !important; }
    /* 手机上去掉厂商列和描述，模型、输入、输出、折扣四列直接放下，不用横向滑动 */
    .price-table { min-width: 0; font-size: 13px; }
    .price-table th, .price-table td { padding: 10px 8px; }
    .price-table .col-vendor, .price-table .model-desc { display: none; }
    .model-name { font-size: 12px; }
    .badge { font-size: 12px; padding: 2px 8px; }
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="inner">
    <div class="left">
      <a class="brand" href="/" aria-label="TokenRocks 首页">
        <span class="brand-mark" aria-hidden="true">T</span>
        <span class="brand-name">TokenRocks</span>
      </a>
      <nav class="main-nav" aria-label="主导航">
        <a class="optional" href="/#features">产品</a>
        <a href="/pricing" aria-current="page">模型</a>
        <a class="optional" href="/#plans">价格</a>
        <a href="/guide/">文档</a>
      </nav>
    </div>
    <div class="header-actions">
      <a class="link-btn" href="/sign-in">登录</a>
      <a class="btn-dark" href="/sign-up">免费开始</a>
    </div>
  </div>
</header>
<script src="/_s/header.js"></script>

<main>
  <section style="background: #F6F7F9; border-bottom: 1px solid #E5E7EB;">
    <div class="wrap" style="padding-top: 48px; padding-bottom: 28px; display: flex; flex-direction: column; gap: 22px;">
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <h1 class="page-title" style="margin: 0; font-size: 40px; font-weight: 800; letter-spacing: -0.8px;">模型与价格</h1>
        <p style="margin: 0; font-size: 16px; color: #4B5563;"><span data-model-count>全部</span> 个模型，每个价格都对比官方原价。单位：元 / 百万 token。</p>
      </div>
      <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px;">
        <div role="group" aria-label="线路" style="display: inline-flex; background: #FFFFFF; border: 1px solid #E5E7EB; border-radius: 10px; padding: 4px; gap: 4px;">
          <button type="button" class="tier-btn" data-tier="value" aria-pressed="true">特价线路</button>
          <button type="button" class="tier-btn" data-tier="enterprise" aria-pressed="false">企业满血线路</button>
        </div>
        <div style="display: flex; flex: 1 1 260px; max-width: 360px;">
          <label for="model-search" class="sr-only">搜索模型</label>
          <input id="model-search" type="search" placeholder="搜索模型名，例如 opus" autocomplete="off" style="width: 100%; height: 44px; padding: 0 14px; border: 1px solid #D1D5DB; border-radius: 10px; font-size: 15px; font-family: inherit; background: #FFFFFF;">
        </div>
      </div>
      <div id="vendor-chips" role="group" aria-label="厂商" style="display: flex; flex-wrap: wrap; gap: 8px;"></div>
    </div>
  </section>

  <section aria-labelledby="text-title" class="wrap" style="padding-top: 28px; padding-bottom: 8px; display: flex; flex-direction: column; gap: 14px;">
    <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px;">
      <h2 id="text-title" style="margin: 0; font-size: 20px; font-weight: 700;">文本与编码 · <span id="tier-name">特价线路</span></h2>
      <span id="tier-note" style="font-size: 14px; color: #4B5563;"></span>
    </div>
    <div style="overflow-x: auto; border: 1px solid #E5E7EB; border-radius: 12px;">
      <table class="price-table">
        <caption class="sr-only">文本模型价格，单位元每百万 token，划线为官方价</caption>
        <thead>
          <tr><th scope="col">模型</th><th scope="col" class="col-vendor">厂商</th><th scope="col">输入</th><th scope="col">输出</th><th scope="col">缓存命中</th><th scope="col">折扣</th></tr>
        </thead>
        <tbody id="text-rows"><tr><td colspan="6" class="status">价格加载中…</td></tr></tbody>
      </table>
    </div>
    <p style="margin: 0; font-size: 13px; color: #4B5563;">划线为官方价。不确定选哪条线路？密钥分组用 auto，会按模型自动选最便宜的可用线路。点模型名查看详情。</p>
  </section>

  <section aria-labelledby="img-title" class="wrap" style="padding-top: 36px; padding-bottom: 72px; display: flex; flex-direction: column; gap: 16px;">
    <h2 id="img-title" style="margin: 0; font-size: 20px; font-weight: 700;">图片生成 · 按张计费</h2>
    <div id="image-cards" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px;"></div>
  </section>
</main>

<footer class="site-footer">
  <div class="inner">
    <div class="col"><span class="title" style="font-size: 16px;">TokenRocks</span><span>大模型 API 平台</span></div>
    <div class="col"><span class="title">产品</span><a href="/pricing">模型与价格</a><a href="/#plans">线路方案</a><a href="/dashboard">控制台</a></div>
    <div class="col"><span class="title">资源</span><a href="/guide/">使用指南</a><a href="https://github.com/cutebug0523/tokenrocks-new-api">GitHub 开源</a></div>
    <div class="col"><span class="title">联系</span><span>微信 bbslaoli</span></div>
  </div>
</footer>

<script src="/_s/prices.js?v=20261030"></script>
<script src="/_s/pricing.js?v=20261030"></script>
<script src="/_s/wechat.js?v=20261031"></script>
</body>
</html>
