    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />

    <!-- Primary Meta Tags -->
    <!-- TokenRocks：新用户第一次打开、分享卡片、搜索结果只读这几行，等不到程序按「系统名称」改标题（店主 11-06，见 AGENTS.md「TokenRocks 例外」） -->
    <title>TokenRocks</title>
    <meta name="title" content="TokenRocks" />
    <meta
      name="description"
      content="一套接口接入 DeepSeek、Qwen、Claude、GPT 等主流大模型，按量付费，余额不过期。"
    />

    <meta name="theme-color" content="#fff" />
    <!-- Resolve the theme before first paint so the page never flashes light
         and one-shot detectors (e.g. Dark Reader) see the real theme.
         Keep in sync with ThemeProvider and THEME_STORAGE_KEYS.mode. -->
    <script>
      ;(function () {
        var theme = 'system'
        try {
          theme = localStorage.getItem('newapi:theme:v1:mode') || 'system'
        } catch (e) {}
        if (theme !== 'dark' && theme !== 'light') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
        }
        document.documentElement.classList.add(theme)
      })()
    </script>
    <!--umami-->
    <!--Google Analytics-->
    <!-- TokenRocks：右边缘的「加官方群」竖条，脚本和样式由 nginx 从静态官网目录（tokenrocks/site/_s/）提供 -->
    <script src="/_s/wechat.js?v=20261031" data-place="side" defer></script>
  </head>
